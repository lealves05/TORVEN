# Blueprint do Render — cria a API do TORVEN automaticamente.
services:
  - type: web
    name: torven-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
