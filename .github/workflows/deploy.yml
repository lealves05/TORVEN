name: Deploy (Vercel)

# Publica o site (frontend/) na Vercel a cada push na main.
# A API continua na Supabase Edge Function "torven-api"; o vercel.json encaminha /api/* para ela.
# Segredo necessário no repositório: VERCEL_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      WEB_PROJECT: torven
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest

      - name: Descobrir conta/time da Vercel
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error title=VERCEL_TOKEN::segredo não configurado"; exit 1; }
          curl -s "https://api.vercel.com/v2/user" -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/u.json
          TEAM=$(node -p "const u=JSON.parse(require('fs').readFileSync('/tmp/u.json')).user||{}; u.defaultTeamId||''")
          USERNAME=$(node -p "(JSON.parse(require('fs').readFileSync('/tmp/u.json')).user||{}).username||''")
          [ -n "$USERNAME" ] || { echo "::error title=Vercel::token inválido — $(head -c 300 /tmp/u.json)"; exit 1; }
          if [ -n "$TEAM" ]; then
            SLUG=$(curl -s "https://api.vercel.com/v2/teams/$TEAM" -H "Authorization: Bearer $VERCEL_TOKEN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).slug||''))")
            echo "TEAMQ=?teamId=$TEAM" >> "$GITHUB_ENV"; echo "SCOPE=$SLUG" >> "$GITHUB_ENV"
          else
            echo "TEAMQ=" >> "$GITHUB_ENV"; echo "SCOPE=$USERNAME" >> "$GITHUB_ENV"
          fi
          echo "Conta: $USERNAME · time: ${TEAM:-pessoal}"

      - name: Criar projeto na Vercel (se não existir)
        run: |
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -X POST "https://api.vercel.com/v11/projects$TEAMQ" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"name\":\"$WEB_PROJECT\",\"framework\":\"vite\",\"rootDirectory\":null}")
          echo "projeto -> $code"
          [ "$code" = "200" ] || [ "$code" = "409" ] || { echo "::error title=Vercel projeto $code::$(tr -d '\n' < /tmp/p.json | head -c 600)"; exit 1; }

      - name: Deploy do site
        id: web
        working-directory: frontend
        run: |
          vercel link --yes --project "$WEB_PROJECT" --token "$VERCEL_TOKEN" --scope "$SCOPE" 2>/tmp/err || { echo "::error title=vercel link::$(tail -c 900 /tmp/err | tr '\n' ' ')"; exit 1; }
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$SCOPE" > /tmp/url.txt 2>/tmp/err || { echo "::error title=vercel deploy::$(tail -c 900 /tmp/err | tr '\n' ' ')"; exit 1; }
          PID=$(node -p "require('./.vercel/project.json').projectId")
          ORG=$(node -p "require('./.vercel/project.json').orgId")
          # site público (sem a proteção por login da Vercel)
          curl -fsS -X PATCH "https://api.vercel.com/v9/projects/$PID?teamId=$ORG" -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' -d '{"ssoProtection":null}' >/dev/null || true
          DOMAIN=$(curl -fsS "https://api.vercel.com/v9/projects/$PID/domains?teamId=$ORG" -H "Authorization: Bearer $VERCEL_TOKEN" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).domains||[];console.log((d.find(x=>x.name.endsWith('.vercel.app'))||d[0]||{}).name||'')})")
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "::notice title=Site publicado::https://$DOMAIN"
          { echo "## TORVEN na Vercel"; echo "- Site: https://$DOMAIN"; echo "- Deploy: $(cat /tmp/url.txt)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificação em produção
        run: |
          SITE="https://${{ steps.web.outputs.domain }}"
          sleep 5
          c1=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/")
          c2=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/entrar")
          c3=$(curl -s -o /tmp/h -w '%{http_code}' "$SITE/api/health")
          echo "::notice title=Verificação::$SITE → / $c1 · /entrar $c2 · /api/health $c3 $(head -c 120 /tmp/h)"
          [ "$c1" = "200" ] && [ "$c3" = "200" ]
